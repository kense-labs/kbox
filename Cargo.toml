[workspace]
resolver = "3"
members = [
    "crates/acl",
    "crates/box/cli",
    "crates/box/core",
    "crates/box/cri",
    "crates/box/deps/libksys",
    "crates/box/guest/init",
    "crates/box/netproxy",
    "crates/box/runtime",
    "crates/box/shim",
    "crates/box/third_party/mkext4",
    "crates/common",
    "crates/oci-runtime/crates/agent",
    "crates/oci-runtime/crates/agent-protocol",
    "crates/oci-runtime/crates/cli",
    "crates/oci-runtime/crates/core",
    "crates/oci-runtime/crates/kbox",
    "crates/oci-runtime/crates/runtime",
    "crates/oci-runtime/crates/sdk",
    "crates/runtime",
]
default-members = ["crates/runtime", "crates/box/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"

[workspace.dependencies]
agent-client-protocol = {features = ["unstable"], version = "0.10.4"}
anyhow = {features = ["backtrace"], version = "1"}
arc-swap = {version = "1.7"}
async-stream = {version = "0.3"}
async-trait = {version = "0.1"}
axum = {features = ["macros", "ws"], version = "0.8"}
axum-server = {features = ["tls-rustls"], version = "0.8"}
backon = {version = "1.6"}
base64 = {version = "0.22"}
blake3 = {version = "1"}
bytes = {features = ["serde"], version = "1"}
chrono = {version = "0.4"}
clap = {features = ["derive", "env"], version = "4"}
criterion = {version = "0.6"}
dashmap = {version = "6"}
dirs = {version = "5.0"}
dunce = {version = "1"}
filetime = {version = "0.2.25"}
flate2 = {default-features = false, features = ["zlib-rs"], version = "1"}
fs2 = {version = "0.4"}
futures = {version = "0.3"}
futures-util = {version = "0.3"}
git2 = {default-features = false, features = ["vendored-libgit2"], version = "0.20"}
glob = {version = "0.3"}
globset = {version = "0.4"}
http = {version = "1"}
ignore = {version = "0.4"}
image = {default-features = false, features = ["png"], version = "0.25.10"}
indexmap = {features = ["serde"], version = "2"}
libc = {version = "0.2"}
log = {features = ["kv", "kv_unstable"], version = "0.4"}
nix = {features = ["poll", "process", "signal", "sched", "term", "mount", "fs", "ioctl", "mman", "reboot", "user"], version = "0.30"}
notify = {version = "8"}
num_cpus = {version = "1"}
obfstr = {version = "0.4"}
opentelemetry = {version = "0.32"}
opentelemetry_sdk = {features = ["spec_unstable_metrics_views", "testing"], version = "0.32.1"}
parking_lot = {version = "0.12.4"}
portable-pty = {version = "0.9"}
pretty_assertions = {version = "1"}
prometheus = {features = ["process"], version = "0.14"}
prost = {version = "0.14"}
pulldown-cmark = {version = "0.13"}
rand = {version = "0.9"}
rcgen = {features = ["pem", "x509-parser"], version = "0.13"}
regex = {version = "1"}
reqwest = {default-features = false, features = ["rustls-tls", "stream", "json", "multipart", "http2", "blocking", "socks"], version = "0.12"}
reqwest-middleware = {features = ["json", "multipart"], version = "0.4.1"}
rusqlite = {features = ["bundled"], version = "0.37"}
rustls = {features = ["aws-lc-rs"], version = "0.23"}
schemars = {version = "1"}
semver = {version = "1"}
serde = {features = ["derive"], version = "1"}
serde_json = {version = "1"}
serde_yaml = {version = "0.9"}
serial_test = {version = "3"}
sha2 = {version = "0.10"}
shellexpand = {version = "3.1"}
similar = {version = "2.7"}
strum = {features = ["derive"], version = "0.27"}
syntect = {default-features = false, features = ["default-onig"], version = "5.3"}
tar = {version = "0.4"}
tempfile = {version = "3"}
textwrap = {version = "0.16"}
thiserror = {version = "2"}
tokio = {features = ["full"], version = "1"}
tokio-stream = {features = ["net"], version = "0.1"}
tokio-util = {features = ["rt"], version = "0.7"}
toml = {version = "0.9"}
tonic = {features = ["tls-aws-lc", "gzip", "deflate", "zstd"], version = "0.14"}
tracing = {version = "0.1"}
tracing-subscriber = {default-features = false, features = ["env-filter", "smallvec", "tracing-log", "std", "ansi"], version = "0.3.23"}
unicode-segmentation = {version = "1.12.0"}
unicode-width = {version = "0.2"}
url = {version = "2"}
urlencoding = {version = "2"}
uuid = {features = ["serde", "v4", "v5", "v7"], version = "1"}
walkdir = {version = "2"}
webbrowser = {version = "1.0.4"}
which = {version = "8"}
windows = {features = ["Win32_Security", "Win32_Security_Authorization", "Win32_Foundation", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Console", "Win32_System_Pipes"], version = "0.61"}
wiremock = {version = "0.6"}
zstd = {version = "0.13"}

kacl = { path = "crates/acl" }
kboot = { path = "crates/boot", features = [
    "auth",
    "axum",
    "cqrs",
    "health",
    "logging",
    "macros",
    "openapi-schemas",
    "queue-postgres",
    "security",
], default-features = false }
kbox-core = { path = "crates/box/core" }
kbox-runtime = { path = "crates/box/runtime", features = ["build", "vm"], default-features = false }
kcore = { path = "crates/code/core", default-features = false }
kevent = { path = "crates/event", features = ["nats", "iggy"], default-features = false }
kflow = { path = "crates/flow", features = ["boot", "postgres"], default-features = false }
kform-core = { path = "crates/form-core" }
korm = { path = "crates/orm", features = ["postgres"], default-features = false }
kbox-contract = { path = "crates/runtime" }
aes-gcm = "0.10"
argon2 = "0.5"
chrono-tz = "=0.10.4"
cron = "=0.17.0"
getrandom = "0.3"
hickory-resolver = { version = "0.24.4", default-features = false, features = [
    "system-config",
    "tokio-runtime",
] }
hmac = "0.12"
http-body-util = "0.1"
hyper = { version = "0.14", features = ["client"] }

# Serialization
hyper-util = { version = "0.1", features = ["server-auto", "service", "tokio"] }
jsonschema = { version = "0.48.5", default-features = false }
lettre = { version = "=0.11.23", default-features = false, features = ["smtp-transport", "tokio1-rustls-tls"] }
object_store = { version = "=0.12.4", default-features = false, features = ["aws"] }
openidconnect = { version = "=4.0.1", default-features = false, features = [
    "reqwest",
    "rustls-tls",
] }
ring = "0.17"

# Shared types (transport protocol, privacy, tools)
rustls-pemfile = "2"
serde_urlencoded = "0.7"
subtle = "2"
time = "0.3"
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "ring", "tls12"] }
tower = "0.4"
x509-parser = "0.16"
zeroize = "1"

# Cryptography (for TEE attestation verification)
zip = { version = "2", default-features = false, features = ["deflate"] }

koci-sdk = { path = "crates/oci-runtime/crates/sdk" }
ktransport = { version = "0.1.1", package = "kcommon", path = "crates/common" }
der = { version = "0.7", features = ["std", "alloc"] }
ecdsa = { version = "0.16", features = ["verifying"] }
hex = "0.4"
oci-distribution = "0.11"

# Table formatting
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
p384 = { version = "0.13", features = ["ecdsa"] }
rustls-pki-types = "1"

# HTTP client (for skill downloads)
spki = "0.7"

# RA-TLS (Remote Attestation TLS)
sysinfo = "0.30"
x509-cert = { version = "0.2", features = ["std"] }

comfy-table = { version = "7", default-features = false }

# Random
olpc-cjson = "0.1"
rmcp = { version = "=0.8.5", default-features = false, features = ["base64", "client", "macros", "server", "transport-io", "transport-streamable-http-client-reqwest", "transport-streamable-http-server"] }
tonic-prost = "0.14"
tonic-prost-build = "0.14"

klibksys = { path = "crates/box/deps/libksys" }
cap-fs-ext = "=4.0.2"
cap-std = "=4.0.2"
libloading = "0.8"
oci-spec = { version = "0.10", default-features = false, features = ["runtime"] }
serde_ignored = "0.1"
windows-sys = { version = "0.59", features = [
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

[workspace.lints.clippy]
# prost 0.14 renders proto doc-comment bullet lists in a way that trips this
# lint on generated code. Kept in sync with bazel/lint/linters.bzl.
doc_lazy_continuation = "allow"
doc_overindented_list_items = "allow"
needless_lifetimes = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"

# Allow uninlined_format_args lint to prevent main from breaking after merges
# When older branches (created before this lint was added to CI) get merged,
# they pass their own CI because their CI config doesn't include this lint check.
# However, once merged to main, the code violates main's lint rules, causing:
# 1. Main's CI to fail
# 2. All new branches based off main to fail CI
# 3. Developers having to fix lint violations from other people's merged code
# Without a merge-queue that runs main's CI checks on the PR branch,
# these violations slip through and break the build for everyone.
# TODO: -> "deny" once/if merge queue enabled
uninlined_format_args = "allow"

# The `fastrace::trace(properties = { … })` proc-macro expands `"{param}"`
# into `format!("{}", param)`, which clippy flags as useless_format.
# Suppressed until the upstream crate fixes its codegen (fixed in 0.7.16+).
useless_format = "allow"

[patch.crates-io]
oci-spec = { path = "crates/oci-runtime/vendor/oci-spec-0.10.0" }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.release-dist]
inherits = "release"
opt-level = "z"
lto = "fat"
