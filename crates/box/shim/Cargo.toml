[package]
name = "kbox-shim"
publish = false
version = "3.2.7"
edition = "2021"
license = "MIT"
description = "MicroVM shim process for Kbox Box"

[[bin]]
name = "kbox-shim"
path = "src/main.rs"

[dependencies]
kbox-core = { path = "../core" }
koci-sdk = { workspace = true }
libksys = { version = "3.0", path = "../deps/libksys", package = "klibksys" }

# Async runtime used by the detached managed-OCI init log projector.
tokio = { workspace = true }

# CLI
clap = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[target.'cfg(unix)'.dependencies]
kbox-netproxy = { path = "../netproxy" }
libc = { workspace = true }

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
koci-kbox = { path = "../../oci-runtime/crates/kbox" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.48", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = { workspace = true }
