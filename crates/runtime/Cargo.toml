[package]
name = "kbox-contract"
publish = false
version = "0.8.0"
edition = "2021"
rust-version = "1.85"
description = "Provider-neutral execution contract and client for Kbox runtimes"
license = "MIT"
repository = "https://github.com/kense-labs/kbox"

[dependencies]
async-trait = "0.1"
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
