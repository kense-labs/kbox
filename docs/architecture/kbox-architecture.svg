<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1680" viewBox="0 0 1100 1680" role="img" aria-labelledby="kbox-title kbox-description">
  <title id="kbox-title">KBox overall architecture</title>
  <desc id="kbox-description">KBox is a Docker-shaped OCI runtime. Default isolation is Sandbox (fused Apache-2.0 container engine in-tree, brand-clean). Higher isolation is optional MicroVM via libkrun. ExecutionManager owns boxes, mounts, networks, and generations. CLI, CRI, and containerd-shim enter one control plane. Verified against source at Spec050 / v3.4.5 era.</desc>
  <metadata>Blueprint style: Kense OS (kbox/docs/architecture prior kbox-architecture.svg · krun architecture palette). Content: current code, not target design. Updated 2026-11-18.</metadata>
  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#141413" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#4E60FF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: Menlo, "SFMono-Regular", Consolas, "PingFang SC", "Microsoft YaHei", monospace; font-weight: 400; fill: #141413; }
      .title { font-size: 36px; font-weight: 500; }
      .section { font-size: 21px; fill: #FDFCF9; }
      .node-title { font-size: 19px; font-weight: 500; text-anchor: middle; }
      .body { font-size: 16px; text-anchor: middle; }
      .label { font-size: 16px; fill: #7A756C; }
      .light { fill: #FDFCF9; }
      .blue { fill: #4E60FF; }
      .panel { fill: #FDFCF9; stroke: #141413; stroke-width: 1; }
      .soft-panel { fill: #FDFCF9; stroke: #DCD6C8; stroke-width: 1; }
      .line { fill: none; stroke: #141413; stroke-width: 1.5; stroke-linejoin: round; }
      .data-line { fill: none; stroke: #4E60FF; stroke-width: 1.8; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1100" height="1680" rx="14" fill="#F8F6F0"/>
  <text class="title" x="100" y="66">KBox</text>
  <text class="label" x="1000" y="64" text-anchor="end">current · from source</text>
  <text x="100" y="104" font-size="19">Docker-shaped OCI runtime · Sandbox default · MicroVM kept</text>

  <!-- peers -->
  <rect class="panel" x="100" y="142" width="240" height="74" rx="6"/>
  <text class="node-title" x="220" y="171">krun · peer repo</text>
  <text class="body" x="220" y="197">ACP harness · intent</text>
  <rect class="panel" x="390" y="142" width="360" height="74" rx="6"/>
  <text class="node-title" x="570" y="171">Users / Agents / CI</text>
  <text class="body" x="570" y="197">CLI · scripts · Studio</text>
  <rect class="panel" x="800" y="142" width="200" height="74" rx="6"/>
  <text class="node-title" x="900" y="171">Platforms</text>
  <text class="body" x="900" y="197">CRI · containerd v2</text>
  <path class="line" d="M570 216V258" marker-end="url(#arrow-ink)"/>

  <!-- ingress -->
  <rect class="panel" x="100" y="258" width="900" height="172" rx="8"/>
  <path d="M108 258H992Q1000 258 1000 266V302H100V266Q100 258 108 258Z" fill="#141413"/>
  <text class="section" x="120" y="287">Ingress · protocol adapters</text>
  <text class="body light" x="980" y="286" style="text-anchor:end">host processes</text>
  <rect class="soft-panel" x="120" y="318" width="274" height="90" rx="6"/>
  <text class="node-title" x="257" y="344">kbox-cli</text>
  <text class="body" x="257" y="370">61 top-level commands</text>
  <text class="body" x="257" y="393">Docker-shaped surface</text>
  <rect class="soft-panel" x="414" y="318" width="274" height="90" rx="6"/>
  <text class="node-title" x="551" y="344">kbox-cri</text>
  <text class="body" x="551" y="370">runtime.v1 gRPC</text>
  <text class="body" x="551" y="393">PodSandbox → Box</text>
  <rect class="soft-panel" x="708" y="318" width="272" height="90" rx="6"/>
  <text class="node-title" x="844" y="344">koci / shim</text>
  <text class="body" x="844" y="370">OCI Runtime v2</text>
  <text class="body" x="844" y="393">koci-sdk transport</text>
  <path class="line" d="M570 430V488" marker-end="url(#arrow-ink)"/>
  <text class="label" x="592" y="465">LocalExecutionManager · one authority</text>

  <!-- control plane -->
  <rect class="panel" x="100" y="488" width="900" height="214" rx="8"/>
  <path d="M108 488H992Q1000 488 1000 496V532H100V496Q100 488 108 488Z" fill="#141413"/>
  <text class="section" x="120" y="517">Control plane · resource authority</text>
  <text class="body light" x="980" y="516" style="text-anchor:end">generation-fenced</text>
  <rect x="120" y="552" width="274" height="126" rx="6" fill="#141413"/>
  <text class="node-title light" x="257" y="580">ExecutionManager</text>
  <text class="body light" x="257" y="607">boxes · mounts · nets</text>
  <text class="body light" x="257" y="632">start / stop / cleanup</text>
  <text class="body light" x="257" y="655">no second state machine</text>
  <rect class="panel" x="414" y="552" width="274" height="126" rx="6"/>
  <text class="node-title" x="551" y="580">Route · boundary</text>
  <text class="body" x="551" y="607">ExecutionBoundary</text>
  <text class="body" x="551" y="632">default = Sandbox</text>
  <text class="body" x="551" y="655">--isolation microvm</text>
  <rect x="708" y="552" width="272" height="126" rx="6" fill="#FDFCF9" stroke="#4E60FF" stroke-width="1.3"/>
  <text class="node-title" x="844" y="580">FileRuntimeState</text>
  <text class="body" x="844" y="607">boxes.json · locks</text>
  <text class="body" x="844" y="632">images / volumes</text>
  <text class="body" x="844" y="655">K_HOME layout</text>
  <path class="line" d="M257 678V740" marker-end="url(#arrow-ink)"/>
  <path class="line" d="M551 678V740" marker-end="url(#arrow-ink)"/>
  <path class="data-line" d="M844 678V740" marker-end="url(#arrow-blue)"/>

  <!-- dual backends -->
  <rect class="panel" x="100" y="740" width="440" height="420" rx="8"/>
  <path d="M108 740H524Q532 740 532 748V784H100V748Q100 740 108 740Z" fill="#4E60FF"/>
  <text class="section" x="120" y="771">Default · Sandbox</text>
  <text class="body light" x="520" y="770" style="text-anchor:end">Spec050</text>
  <rect x="120" y="804" width="400" height="96" rx="6" fill="#141413"/>
  <text class="node-title light" x="320" y="832">kbox-sandbox-engine</text>
  <text class="body light" x="320" y="858">fused container engine</text>
  <text class="body light" x="320" y="881">daemon · Unix HTTP API</text>
  <rect class="soft-panel" x="120" y="916" width="190" height="86" rx="6"/>
  <text class="node-title" x="215" y="944">sandbox-init</text>
  <text class="body" x="215" y="970">Linux agent</text>
  <rect class="soft-panel" x="330" y="916" width="190" height="86" rx="6"/>
  <text class="node-title" x="425" y="944">sandbox-guest</text>
  <text class="body" x="425" y="970">Image · initramfs</text>
  <rect class="soft-panel" x="120" y="1018" width="400" height="62" rx="6"/>
  <text class="body" x="320" y="1042">namespaces · compose nets · secrets scrub</text>
  <text class="body" x="320" y="1064">brand-zero · Apache NOTICE retained</text>
  <rect x="120" y="1098" width="400" height="42" rx="4" fill="#EFEBE1"/>
  <text class="body" x="320" y="1125">daily path · macOS / Linux / WSL evidence</text>

  <rect class="panel" x="560" y="740" width="440" height="420" rx="8"/>
  <path d="M568 740H984Q992 740 992 748V784H560V748Q560 740 568 740Z" fill="#141413"/>
  <text class="section" x="580" y="771">First-class · MicroVM</text>
  <text class="body light" x="980" y="770" style="text-anchor:end">--isolation microvm</text>
  <rect x="580" y="804" width="400" height="96" rx="6" fill="#141413"/>
  <text class="node-title light" x="780" y="832">libkrun / libkrunfw</text>
  <text class="body light" x="780" y="858">HVF · KVM · WHPX</text>
  <text class="body light" x="780" y="881">DedicatedVm per box</text>
  <rect class="soft-panel" x="580" y="916" width="190" height="86" rx="6"/>
  <text class="node-title" x="675" y="944">kbox-shim</text>
  <text class="body" x="675" y="970">host enter</text>
  <rect class="soft-panel" x="790" y="916" width="190" height="86" rx="6"/>
  <text class="node-title" x="885" y="944">guest-init</text>
  <text class="body" x="885" y="970">PID 1 · vsock</text>
  <rect class="soft-panel" x="580" y="1018" width="400" height="62" rx="6"/>
  <text class="body" x="780" y="1042">independent guest kernel · higher isolation</text>
  <text class="body" x="780" y="1064">retained product path · not removed</text>
  <rect x="580" y="1098" width="400" height="42" rx="4" fill="#EFEBE1"/>
  <text class="body" x="780" y="1125">same CLI · same ExecutionManager</text>

  <path class="line" d="M550 1160V1200" marker-end="url(#arrow-ink)"/>

  <!-- data plane -->
  <rect class="panel" x="100" y="1200" width="900" height="200" rx="8"/>
  <path d="M108 1200H992Q1000 1200 1000 1208V1244H100V1208Q100 1200 108 1200Z" fill="#141413"/>
  <text class="section" x="120" y="1231">Data plane · images · compose · pool</text>
