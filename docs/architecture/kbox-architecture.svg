  <rect class="soft-panel" x="120" y="1264" width="164" height="110" rx="6"/>
  <text class="node-title" x="202" y="1294">OCI registry</text>
  <text class="body" x="202" y="1320">pull / push</text>
  <text class="body" x="202" y="1344">local image store</text>
  <rect class="soft-panel" x="294" y="1264" width="164" height="110" rx="6"/>
  <text class="node-title" x="376" y="1294">build</text>
  <text class="body" x="376" y="1320">Dockerfile</text>
  <text class="body" x="376" y="1344">no dockerd</text>
  <rect class="soft-panel" x="468" y="1264" width="164" height="110" rx="6"/>
  <text class="node-title" x="550" y="1294">volumes</text>
  <text class="body" x="550" y="1320">networks</text>
  <text class="body" x="550" y="1344">compose</text>
  <rect class="soft-panel" x="642" y="1264" width="164" height="110" rx="6"/>
  <text class="node-title" x="724" y="1294">pool</text>
  <text class="body" x="724" y="1320">prewarm</text>
  <text class="body" x="724" y="1344">attach / drain</text>
  <rect class="soft-panel" x="816" y="1264" width="164" height="110" rx="6"/>
  <text class="node-title" x="898" y="1294">KCL</text>
  <text class="body" x="898" y="1320">pinned git rev</text>
  <text class="body" x="898" y="1344">config only</text>

  <!-- footer notes -->
  <rect class="soft-panel" x="100" y="1430" width="440" height="110" rx="6"/>
  <text class="node-title" x="320" y="1464">Security contracts</text>
  <text class="body" x="320" y="1492">secrets scrubbed from durable Env</text>
  <text class="body" x="320" y="1516">no silent isolation downgrade</text>
  <rect x="560" y="1430" width="440" height="110" rx="6" fill="#FDFCF9" stroke="#4E60FF" stroke-width="1.2"/>
  <text class="node-title blue" x="780" y="1464">Explicitly not claimed</text>
  <text class="body blue" x="780" y="1492">product Pass · Apple notarize</text>
  <text class="body blue" x="780" y="1516">native win32 Sandbox package</text>

  <rect x="100" y="1570" width="900" height="70" rx="6" fill="#4E60FF"/>
  <text class="body light" x="550" y="1600">One CLI · two isolation grades · ExecutionManager is the only resource authority</text>
  <text class="body light" x="550" y="1624">ACP / LLM live in krun · KBox stays the execution substrate</text>

  <path class="data-line" d="M100 179H50V595H120" marker-start="url(#arrow-blue)" marker-end="url(#arrow-blue)"/>
  <text class="blue" x="28" y="390" font-size="17" text-anchor="middle" transform="rotate(-90 28 390)">krun ↔ kbox · wire contracts</text>
  <path class="line" d="M1000 179H1050V360H1000" marker-end="url(#arrow-ink)"/>
  <text class="label" x="1075" y="280" font-size="17" text-anchor="middle" transform="rotate(90 1075 280)">CRI / shim ingress</text>
</svg>
