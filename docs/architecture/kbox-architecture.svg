<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1900" viewBox="0 0 1100 1900" role="img" aria-labelledby="kbox-title kbox-description">
  <title id="kbox-title">KBox 当前架构</title>
  <desc id="kbox-description">KBox 是独立 Rust workspace。krun 通过 Unix socket 上的版本化 kbox.engine 请求调用 Engine 控制面，kbox-cri 与 containerd-shim 提供 CRI / OCI Runtime v2 协议适配。ExecutionManager 持有 VM、进程、挂载、网络与文件 JSON 状态，是资源权威。唯一虚拟化后端是 libkrun / libkrunfw；kbox-shim 与 koci-kshim 是同一后端下的两条内部宿主进程实现，不是两个可切换后端。客体侧由 kbox-guest-init / koci-agent 承担 PID 1 与 guest 服务。ACP 与 LLM 属 krun，不在 KBox 内。虚线框表示规划但尚未实现的能力。</desc>
  <metadata>Blueprint style follows krun/docs/architecture/krun-architecture.svg (Kense OS, kstack/docs/architecture/kense-os-modules.html). Content verified against kbox code at HEAD 405c8b8, 2026-11-12. Current architecture, not a target design; dashed boxes are unimplemented plans.</metadata>
